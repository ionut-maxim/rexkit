# release-please keeps a release PR open from the Conventional Commits on
# main. Merging it tags vX.Y.Z and publishes the GitHub release with the
# changelog. This is a library, so nothing is built or uploaded.
name: release

on:
  push:
    branches: [main]

# The repository's default GITHUB_TOKEN is read-only; the job asks for what
# it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
